        nature of the hydrocarbon pool at different stages of the methanol\u2010to\u2010hydrocarbons
        reaction over ZSM\u20105 is examined. A combination of reaction testing, analytical
        and spectroscopic techniques is employed to investigate changes in the nature
        and form of the hydrocarbon pool as a function of reaction conditions and
        reaction time. It is shown that inelastic neutron scattering spectroscopy
        (INS) complements other spectroscopic methods for observing molecular components
        in the hydrocarbon pool of working catalysts. INS is uniquely able to spectroscopically
        identify the form of coke species present in deactivated catalysts.<\/jats:p>","DOI":"10.1002\/cctc.202100286","type":"journal-article","created":{"date-parts":[[2021,3,8]],"date-time":"2021-03-08T11:54:34Z","timestamp":1615204474000},"page":"2625-2633","update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":13,"title":["New
