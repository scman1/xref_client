        properties of Mo\u2010doped iron oxide are compared with those of the single
        oxides of Fe and Mo, and with stoichiometric ferric molybdate for the selective
        oxidation of methanol. It is found that Mo oxide segregates to the surface
        of the iron oxide at low loadings, while at higher loadings, but below the
        stoichiometric ratio, presents layers of ferric molybdate at the surface.
        The relationship between bulk loading and surface Mo is explored, and it is
        concluded that the reactivity is dominated by ensemble effects. Simple modelling
        indicates that four or more Fe cation ensembles are required to combust methanol
        to CO<jats:sub>2<\/jats:sub>, ensembles of two Mo cations are required for
