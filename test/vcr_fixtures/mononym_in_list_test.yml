        reactions under which interstitial structures of Pd form are profoundly important
        and prevalent in catalysis; the formation and stability of Pd hydride structures
        are well understood, however, interstitial structures of the carbide and nitride
        are relatively under explored. This work reports a systematic study of the
        formation and stability of PdC<jats:sub>x<\/jats:sub> and PdN<jats:sub>x<\/jats:sub>
        at elevated temperatures and different atmospheres using <jats:italic>in\u2005situ<\/jats:italic>
        Pd L<jats:sub>3<\/jats:sub> edge XANES spectroscopy. These studies were further
        complemented by the application of <jats:sup>14<\/jats:sup>N MAS\u2010NMR
        experiments and computational DFT investigations. The experiments confirmed
        that PdC<jats:sub>x<\/jats:sub> was significantly more stable than PdN<jats:sub>x<\/jats:sub>;
        <jats:sup>14<\/jats:sup>N MAS\u2010NMR provided direct confirmation on the
        formation of the nitride, however, the XANES studies evidenced very limited
        stability under the conditions employed. Moreover, the results suggest that
        the formation of the nitride imparts some structural changes that are not
        entirely reversible under the conditions used in these experiments. This work
        provides important insights into the stability of interstitial structures
        of Pd and the conditions in which they could be employed for directed catalytic
        processes.<\/jats:p>","DOI":"10.1002\/cctc.202300870","type":"journal-article","created":{"date-parts":[[2023,9,7]],"date-time":"2023-09-07T05:14:25Z","timestamp":1694063665000},"update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":2,"title":["Towards
