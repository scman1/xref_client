        of phosphine\u2010decorated polymer\u2010immobilized ionic liquid with the
        tetrachloroaurate anion results in reduction of the gold(III) to gold(I) with
        concomitant oxidation of the phosphine to its oxide. In situ reduction of
        the resulting precursor, AuCl@O\u00a0=\u00a0PPh<jats:sub>2<\/jats:sub>\u2010PEGPIILS,
        generated the corresponding O\u00a0=\u00a0PPh<jats:sub>2<\/jats:sub>\u2010PEGPIIL\u2010stabilized
        AuNPs, AuNP@O\u00a0=\u00a0PPh<jats:sub>2<\/jats:sub>\u2010PEGPIILS, which
        is a highly active and selective catalyst for the solvent\u2010dependent partial
        reduction of nitrobenzene to <jats:italic>N<\/jats:italic>\u2010phenylhydroxylamine
        in water and azoxybenzene in ethanol. The initial TOFs are comparable to those
        obtained with gold nanoparticles generated by reduction of tetrachloroaurate\u2010impregnated
        phosphine oxide\u2010decorated polymer\u2010immobilized ionic liquid AuCl<jats:sub>4<\/jats:sub>@O\u00a0=\u00a0PPh<jats:sub>2<\/jats:sub>\u2010PEGPIILS,
        i.e., the activity and selectivity profiles do not appear to depend on whether
        the AuNPs are generated from Au(III) or in situ\u2010generated Au(I). In stark
        contrast, gold nanoparticles prepared by NaBH<jats:sub>4<\/jats:sub> reduction
        of AuCl@PPh<jats:sub>2<\/jats:sub>\u2010PEGPIILS based on gold(I) confined
        in phosphine\u2010modified polymer\u2010immobilized ionic liquid gave markedly
        lower initial TOFs. The use of dimethylamine borane (DMAB) as the hydrogen
        donor resulted in a substantial and dramatic enhancement in activity for reductions
        conducted in water compared with NaBH<jats:sub>4<\/jats:sub> and the initial
        TOF of 20,400\u00a0mol nitrobenzene converted mol\u00a0Au<jats:sup>\u22121<\/jats:sup>\u00a0h<jats:sup>\u22121<\/jats:sup>
        obtained with AuNPs generated in situ from AuCl<jats:sub>4<\/jats:sub>@O\u00a0=\u00a0PPh<jats:sub>2<\/jats:sub>\u2010PEGPIILS
        is among the highest to be reported for the metal nanoparticle catalyzed selective
        reduction of nitrobenzene to <jats:italic>N<\/jats:italic>\u2010phenylhydroxylamine;
        this is a significant improvement on existing protocols, which should enable
        the partial selective reduction of nitroarenes to be conducted in water with
