        tandem catalytic ensemble of solid\u2010state molecular organometallic (SMOM)
        crystalline pre\u2010catalysts are deployed under batch or flow conditions
        for the ethene to propene process (ETP). These catalysts operate at ambient
        temperature and low pressure, via sequential ethene dimerization, butenes
        isomerization and cross\u2010metathesis. Under flow conditions the on\u2010stream
        ethene conversion (55\u2009%), initial propene selectivity (92\u2009%), stability
        (71\u2009% selectivity after 7\u2005h) and low temperature\/pressures are
        competitive with the best\u2010in\u2010class heterogeneous systems, marking
