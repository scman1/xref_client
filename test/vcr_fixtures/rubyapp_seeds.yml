        Grant for Simulation and Modeling"],"award-info":[{"award-number":["Academic
        Grant for Simulation and Modeling"]}],"id":[{"id":"10.13039\/100007065","id-type":"DOI","asserted-by":"crossref"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"accepted":{"date-parts":[[2025,7,19]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>\n                  Despite
        recent breakthroughs in deep learning methods for protein design, existing
        computational pipelines remain rigid, highly specific, and ill-suited for
        tasks requiring non-differentiable or multi-objective design goals. In this
        report, we introduce\n                  <jats:monospace>BAGEL<\/jats:monospace>\n                  ,
        a modular, open-source framework for programmable protein engineering, enabling
        flexible exploration of sequence space through model-agnostic and gradient-free
        exploration of an energy landscape.\n                  <jats:monospace>BAGEL<\/jats:monospace>\n                  formalizes
        protein design as the sampling of an energy function, either to optimize (find
        a global optimum) or to explore a basin of interest (generate diverse candidates).
        This energy function is composed of user-defined terms capturing geometric
        constraints, sequence embedding similarities, or structural confidence metrics.\n                  <jats:monospace>BAGEL<\/jats:monospace>\n                  also
        natively supports multi-state optimization and advanced Monte Carlo techniques,
        providing researchers with a flexible alternative to fixed-backbone and inverse-folding
        paradigms common in current design workflows. Moreover, the package seamlessly
        integrates a wide range of publicly available deep learning protein models,
        allowing users to rapidly take full advantage of any future improvements in
        model accuracy and speed. We illustrate the versatility of BAGEL on four archetypal
        applications: designing\n                  <jats:italic>de novo<\/jats:italic>\n                  peptide
        binders, targeting intrinsically disordered epitopes, selectively binding
        to species-specific variants, and generating enzyme variants with conserved
        catalytic sites. By offering a modular, easy-to-use platform to define custom
        protein design objectives and optimization strategies,\n                  <jats:monospace>BAGEL<\/jats:monospace>\n                  aims
        to speed up the design of new proteins. Our goal with its release is to democratize
        protein design, abstracting the process as much as possible from technical
        implementation details and thereby making it more accessible to the broader
        scientific community, unlocking untapped potential for innovation in biotechnology
        and therapeutics.\n                <\/jats:p>","DOI":"10.1101\/2025.07.05.663138","type":"posted-content","created":{"date-parts":[[2025,7,11]],"date-time":"2025-07-11T09:00:26Z","timestamp":1752224426000},"source":"Crossref","is-referenced-by-count":2,"title":"BAGEL:
