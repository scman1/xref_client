        Chemie"],"published-print":{"date-parts":[[2025,3,17]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p>In
        homogeneous catalysis, uncovering structure\u2013activity relationships remains
        very rare but invaluable to understand and rationally improve performances.
        Here, generalizable structure\u2013activity relationships apply to a series
        of heterodinuclear polymerization catalysts featuring Co(III) and s\u2010block
        metals M(I\/II) (M=Na(I), K(I), Ca(II), Sr(II), Ba(II)). These are shown to
        apply to polycarbonate production by the ring\u2010opening copolymerizations
        (ROCOP) of cyclohexene oxide (CHO) and carbon dioxide (CO<jats:sub>2<\/jats:sub>),
        conducted at high (20\u2005bar) and low (1\u2005bar) CO<jats:sub>2<\/jats:sub>
        pressures, and to polyester production by copolymerization of cyclohexene
        oxide and phthalic anhydride (PA). For the CHO\/PA and high\u2010pressure
        CHO\/CO<jats:sub>2<\/jats:sub> copolymerizations, activity increases exponentially
        with s\u2010block metal acidity peaking at the Co(III)K(I) catalyst, whilst
        for the low\u2010pressure CHO\/CO<jats:sub>2<\/jats:sub> copolymerization
        it increases linearly to the same metal combination. The polymerization kinetics
        fit second order rate laws and the correlations support dinuclear metallate
        mechanistic hypotheses. These relationships help understand and identify key
        metal complex structural features in synergic polymerization catalysis.<\/jats:p>","DOI":"10.1002\/ange.202422497","type":"journal-article","created":{"date-parts":[[2025,1,6]],"date-time":"2025-01-06T10:14:24Z","timestamp":1736158464000},"update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":0,"title":["Structure\u2010Activity
