        plasmonic nanostructures offer an unparalleled opportunity for the study of
        light\u2013matter interactions at the nanoscale and realization of compact
        nanophotonic devices. In this study, we introduce an ultrathin gold nanoribbon
        array and demonstrate an electric approach to actively tuning its plasmonic
        resonance, which leveraging the extreme light confinement capability in the
        ultrathin plasmonic nanostructure and a robust nanoscale electro-optical effect
        in indium tin oxide. Optimizing the design (to a total thickness as small
        as 12\u00a0nm for a 2-nm-thick gold nanoribbon array), we numerically demonstrate
        a spectral shift in the plasmonic resonance up to 36\u00a0nm along with an
        approximately 16% change in the transmission at a gate voltage below 1.7\u00a0V
        at the wavelength of 1.47\u00a0\u03bcm. This work presents progress towards
        electric tuning of plasmonic resonances in ultrathin metallic nanostructures
        for various applications including surface-enhanced spectroscopy, spontaneous
        emission enhancement, and optical modulation.<\/jats:p>","DOI":"10.1364\/prj.522533","type":"journal-article","created":{"date-parts":[[2024,5,29]],"date-time":"2024-05-29T07:00:58Z","timestamp":1716966058000},"page":"1750","update-policy":"https:\/\/doi.org\/10.1364\/crossmark_policy","source":"Crossref","is-referenced-by-count":4,"title":"Electric
