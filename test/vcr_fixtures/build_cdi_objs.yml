        and Physical Sciences Research Council","doi-asserted-by":"publisher","award":["EP\/T022213"],"award-info":[{"award-number":["EP\/T022213"]}],"id":[{"id":"10.13039\/501100000266","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":["advanced.onlinelibrary.wiley.com"],"crossmark-restriction":true},"published-print":{"date-parts":[[2022,12]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p>High\u2010performance
        nanoparticle platforms can drive catalysis progress to new horizons, delivering
        environmental and energy targets. Nanoparticle exsolution offers unprecedented
        opportunities that are limited by current demanding process conditions. Unraveling
        new exsolution pathways, particularly at low\u2010temperatures, represents
        an important milestone that will enable improved sustainable synthetic route,
        more control of catalysis microstructure as well as new application opportunities.
        Herein it is demonstrated that plasma direct exsolution at room temperature
        represents just such a step change in the synthesis. Moreover, the factors
        that most affect the exsolution process are identified. It is shown that the
        surface defects produced initiate exsolution under a brief ion bombardment
        of an argon low\u2010pressure and low\u2010temperature plasma. This results
        in controlled nanoparticles with diameters \u224819\u201322\u00a0nm with very
        high number densities thus creating a highly active catalytic material for
        CO oxidation which rivals traditionally created exsolved samples.<\/jats:p>","DOI":"10.1002\/aenm.202201131","type":"journal-article","created":{"date-parts":[[2022,10,3]],"date-time":"2022-10-03T08:02:44Z","timestamp":1664784164000},"update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":57,"title":"Rapid
