        j. surg."],"published-print":{"date-parts":[[1985,10]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p><jats:bold>Data
        are presented from a prospective clinical trial in which 1,891 patients with
        histologically confirmed stage II breast cancer were randomized to receive
        adjuvant therapy consisting of 1\u2010phenylalanine mustard and 5\u2010fluorouracil
        (PF) with and without tamoxifen (T). The findings indicate that the benefit
        previously noted for the addition of tamoxifen at 2 and 3 years'' mean follow\u2010up
        is still apparent at 4 years. Although the tamoxifen\u2010containing regimen
        prolongs disease\u2010free survival and survival, this effect is not uniform
        and is dependent on patient age and tumor receptor content. Only those patients
        \u2a7e 50 years of age demonstrated a benefit from the addition of tamoxifen
        to chemotherapy. The benefit was influenced by the degree of quantitative
        tumor receptor content. Patients \u2a7d 49 years of age failed to demonstrate
        a prolongation in disease\u2010free survival with tamoxifen even when the
        tumor estrogen receptor content was \u2a7e100\u00a0fmol. Not only was there
        no benefit attributable to tamoxifen in patients \u2a7d49 years, if the tumor
        progesterone receptors were &lt;10\u00a0fmol there was a significant diminution
        in disease\u2010free survival and survival. The results continue to indicate
        that the response to PFT therapy is heterogeneous in that only specific patient
        subsets demonstrate a salutary effect. Whether this phenomenon of heterogeneity
        is unique to the PFT combination or is an intrinsic biological property of
        stage II breast cancer remains to be ascertained<\/jats:bold>.<\/jats:p>","DOI":"10.1007\/bf01655190","type":"journal-article","created":{"date-parts":[[2005,5,8]],"date-time":"2005-05-08T02:38:26Z","timestamp":1115519906000},"page":"750-755","source":"Crossref","is-referenced-by-count":5,"title":["Adjuvant
        tamoxifen and chemotherapy in stage II breast cancer: Interim findings from
        NSABP protocol B\u201009"],"prefix":"10.1002","volume":"9","author":[{"given":"Norman","family":"Wolmark","sequence":"first","affiliation":[{"name":"Department
