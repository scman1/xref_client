        Accounting Association","issue":"1","content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2025,1,1]]},"abstract":"<jats:title>ABSTRACT<\/jats:title>\n               <jats:p>We
        study the effects of disclosure in a dynamic market with imperfect competition.
        The supply of an asset is determined by a large shareholder with price impact,
        who trades slowly to diversify away from concentrated ownership. Small investors
        provide capital and thus risk-bearing capacity to the market. Although it
        is well known that disclosure impedes risk sharing by shifting risk before
        future trading opportunities, we show that disclosure, at the same time, can
        enhance risk sharing by promoting more trades. Resolving this tradeoff, an
        interior level of disclosure quality maximizes the small investors\u2019 surplus
        as well as the total surplus, but minimizes the large shareholder\u2019s surplus.
        Further, efficient disclosure policies feature increasing quality over time.<\/jats:p>\n               <jats:p>JEL
