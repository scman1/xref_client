        Federal Ministry for Economic Affairs and Climate Action","award":["03LB2041E"]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Applied
        Sciences"],"abstract":"<jats:p>This study introduces a comprehensive knowledge
        graph (KG)-based framework designed to support sustainable decision-making
        by integrating, enriching, and analyzing heterogeneous data sources. The proposed
        methodology leverages domain expertise, real-world data, and synthetic data
        generated through language models to address challenges in life cycle assessment
        (LCA), particularly data scarcity and inconsistency. By modeling the entire
        product lifecycle, including engineering, production, usage, and disposal
        phases, the framework facilitates early-stage design decision-making and provides
        actionable insights for sustainability improvements. The methodology is validated
        through a case study on 3D printing (3DP), demonstrating its ability to manage
        complex data, highlight relationships between engineering decisions and environmental
        impacts, and mitigate data scarcity in the early phases of product development
        in the context of LCAs. In conclusion, the results demonstrate the framework\u2019s
        potential to drive sustainable innovation in manufacturing.<\/jats:p>","DOI":"10.3390\/app15010175","type":"journal-article","created":{"date-parts":[[2024,12,31]],"date-time":"2024-12-31T12:34:19Z","timestamp":1735648459000},"page":"175","source":"Crossref","is-referenced-by-count":0,"title":["A
