        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>The
        symposium aims to provide a multifaceted examination about aging related issues
        within different cultural contexts with a particular focus on the Korean population.
        The first study conducted a cross-cultural examination on financial satisfaction
        during the retirement transition period between South Kore and the U.S., highlighting
        the needs for culturally tailored interventions to support individuals\u2019
        financial wellbeing in retirement. The second study focused on Korean middle-aged
        adults\u2019 residential preferences after retirement, emphasizing the importance
        of understanding evolving housing needs and their impacts on health and social
        interactions in later life. Third study conducted a comparative analysis of
        long-term care policies between South Korea and Singapore, examining the emergence
        of Community Care services as a potential solution for aging-in-place and
        providing valuable insights into the compatibility of such services with different
        cultural and welfare system framework. The last study introduced a psychometrically
        sound scale to measure public stigma associated with Alzheimer\u2019s disease
        among Korean-speaking populations, contributing to a better understanding
        of the nature and magnitude of Alzheimer\u2019s disease stigma, with implications
        for stigma reduction efforts within this population. The symposium offers
        an excellent opportunity to examine various aspect of aging issues among Koreans,
        encompassing financial wellbeing, housing preference, long-term care, and
        public perception of an age-related disease. By examining these topics, the
        symposium will contribute to informing policy and practice in addressing various
        needs of aging populations from a more culturally tailored perspective. Korean\/Korean
        American and Aging Interest Group Sponsored Symposium<\/jats:p>","DOI":"10.1093\/geroni\/igae098.1667","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:31:25Z","timestamp":1735741885000},"page":"510-510","source":"Crossref","is-referenced-by-count":0,"title":["NAVIGATING
        AGING ACROSS CULTURES: THE FORTITUDE IN PERSPECTIVES FROM KOREANS AND BEYOND"],"prefix":"10.1093","volume":"8","author":[{"given":"Michin","family":"Hong","sequence":"first","affiliation":[{"name":"Chair"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Kyungmin","family":"Kim","sequence":"additional","affiliation":[{"name":"Discussant"}],"role":[{"role":"author","vocabulary":"crossref"}]}],"member":"286","published-online":{"date-parts":[[2024,12,31]]},"container-title":["Innovation
        in Aging"],"language":"en","link":[{"URL":"https:\/\/academic.oup.com\/innovateage\/article-pdf\/8\/Supplement_1\/510\/61307528\/igae098.1667.pdf","content-type":"application\/pdf","content-version":"vor","intended-application":"syndication"},{"URL":"https:\/\/academic.oup.com\/innovateage\/article-pdf\/8\/Supplement_1\/510\/61307528\/igae098.1667.pdf","content-type":"unspecified","content-version":"vor","intended-application":"similarity-checking"}],"deposited":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:17:38Z","timestamp":1735748258000},"score":0.0,"resource":{"primary":{"URL":"https:\/\/academic.oup.com\/innovateage\/article\/8\/Supplement_1\/510\/7937259"}},"issued":{"date-parts":[[2024,12]]},"references-count":0,"journal-issue":{"issue":"Supplement_1","published-print":{"date-parts":[[2024,12,31]]}},"URL":"https:\/\/doi.org\/10.1093\/geroni\/igae098.1667","ISSN":["2399-5300"],"issn-type":[{"type":"electronic","value":"2399-5300"}],"published-other":{"date-parts":[[2024,12]]},"published":{"date-parts":[[2024,12]]}},{"indexed":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:40:22Z","timestamp":1735749622670,"version":"3.32.0"},"reference-count":0,"publisher":"Oxford
        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Senescence
        is a multi-functional cell fate, characterized by an irreversible cell-cycle
        arrest and a pro-inflammatory phenotype, commonly known as the senescence-associated
        secretory phenotype (SASP). Emerging evidence indicates that accumulation
        of senescent cells in multiple tissues drives tissue dysfunction and several
        age-related conditions. This has spurred the academic community and industry
        to identify new therapeutic interventions targeting this process. Senescence
        is a complex and highly heterogenous phenotype and despite tremendous progress
        in recent years we are still far from fully understanding it. There is no
        single, stand-alone marker that allows the identification of senescent cells,
        posing a challenge to their identification and targeting. Mitochondrial dysfunction
        is an often-unappreciated hallmark of cellular senescence which plays important
        roles not only in the senescence growth arrest but also in the development
        of the SASP and resistance to cell-death. In my talk, I will first describe
        some of our recent efforts to accurately map senescent cells in different
        tissues, including the application of imaging methods involving artificial
        intelligence. Additionally, I will describe how mitochondria contribute to
        the development of senescence and resistance to cell-death. Finally, I will
        propose that a detailed road map of mitochondrial biology in senescence will
        be crucial to guide the future development of therapies targeting cellular
        aging.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.1907","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:32:28Z","timestamp":1735741948000},"page":"582-583","source":"Crossref","is-referenced-by-count":0,"title":["CELL
