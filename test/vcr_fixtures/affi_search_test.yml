        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Vision
        loss is common among older adults and is associated with reduced activity.
        However, few studies have examined the value of various activities for older
        adults with visual difficulty. Using nationally representative data from the
        National Health and Aging Trends Study 2022, we examined activity preferences
        and participation among older adults with and without visual difficulty (N=5,807).
        We explored potential barriers (e.g., transportation, health, and COVID-19)
        limiting participation in valued activities. Visual difficulty was measured
        by self-reported vision status and impairments. Valued activities were assessed
        by four items: visiting friends and family who lived separately, attending
        religious services, participating in clubs, classes, or other organized activities,
        and going out for enjoyment. Activities rated as \u201cvery important\u201d
        were considered to be of personal value to the individuals. Weighted sample
        characteristics showed that 56.3% of participants aged between 65 and 74 years
        old, and 8.6% experienced visual difficulty: 6.5% near or distance visual
        difficulty, 1.9% near and distance visual difficulty, and 0.3% blindness.
        Overall, most older adults (58.7%) rated visiting friends\/family as important.
        Logistic regression results showed that older adults with near and distance
        visual difficulty were less likely to engage in valued activities (OR = 0.36)
        and more likely to report health-related (OR = 2.75) or COVID-19 restrictions
        (OR = 2.04) for ceasing participation in any valued activity, compared to
        those with no visual difficulty. Findings underscore the significance of developing
        interventions that bridge the gap between activity preferences and participation
        for older adults with visual difficulty.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2534","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T17:16:40Z","timestamp":1735751800000},"page":"780-780","source":"Crossref","is-referenced-by-count":0,"title":["VISUAL
        DIFFICULTY AND VALUED ACTIVITY AMONG OLDER ADULTS: FINDINGS FROM THE NATIONAL
        HEALTH AND AGING TRENDS STUDY"],"prefix":"10.1093","volume":"8","author":[{"given":"Shu","family":"Xu","sequence":"first","affiliation":[{"name":"University
        of Michigan , Ann Arbor, Michigan, United States"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Haowei","family":"Wang","sequence":"additional","affiliation":[{"name":"Syracuse
