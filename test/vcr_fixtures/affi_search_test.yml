        Medical Press Limited","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Asia-Pac
        J Pharmacother Toxicol"],"published-print":{"date-parts":[[2025,12,30]]},"abstract":"<jats:p>Bioactive
        compounds from natural sources play an important role as an immunomodulator
        in diseases such as cancer, inflammatory and viral diseases. Immunomodulator
        functions to regulate the immune system and defends against infectious foreign
        particles. Naturally occurring bioactive compounds have been shown to boost
        the immunity and increase the anti-cancer immune response, as well as in cancer
        patients. Prodigiosin is reported as an anticancer agent and effective against
        multiple tumor cell lines and also combat to viral diseases. Innate cytotoxicity
        is one of the main problems linked with the use of immunosuppressants, especially
        in oncology that leads scientists toward the application of combined regimens.
        In this perception, prodigiosin offers an interesting perspective of combinatorial
        applications. However, the major devastating limitation associated with its
        use is an infectious strain: Serratia marcescens source linked with a few
        harmful pathologies in mammals. The present article will review the potential
        roles of prodigiosin as a key player of immunomodulator in different immune
        cells such as T and B lymphocytes, macrophages, dendritic cells and natural
        killer cells as well as antiviral activity.<\/jats:p>","DOI":"10.32948\/ajpt.2024.12.19","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T15:16:48Z","timestamp":1735744608000},"update-policy":"https:\/\/doi.org\/10.32948\/asme.crossmark.policy","source":"Crossref","is-referenced-by-count":1,"title":["Insight
