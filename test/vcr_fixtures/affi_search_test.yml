        Meteorological Society","issue":"6","content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2005,6,1]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p>Detailed
        observations of the interactions of a cold front and a dryline over the central
        United States that led to dramatic undulations in the boundary layer, including
        an undular bore, are investigated using high-resolution water vapor mixing
        ratio profiles measured by Raman lidars. The lidar-derived water vapor mixing
        ratio profiles revealed the complex interaction between a dryline and a cold-frontal
        system. An elevated, well-mixed, and deep midtropospheric layer, as well as
        a sharp transition (between 5- and 6-km altitude) to a drier region aloft,
        was observed. The moisture oscillations due to the undular bore and the mixing
        of the prefrontal air mass with the cold air at the frontal surface are all
        well depicted. The enhanced precipitable water vapor and roll clouds, the
        undulations associated with the bore, the strong vertical circulation and
        mixing that led to the increase in the depth of the low-level moist layer,
        and the subsequent lifting of this moist layer by the cold-frontal surface,
        as well as the feeder flow behind the cold front, are clearly indicated.<\/jats:p><jats:p>A
        synthesis of the Raman lidar\u2013measured water vapor mixing ratio profiles,
        satellite, radiometer, tower, and Oklahoma Mesonet data indicated that the
        undular bore was triggered by the approaching cold front and propagated south-southeastward.
        The observed and calculated bore speeds were in reasonable agreement. Wave-ducting
        analysis showed that favorable wave-trapping mechanisms existed; a low-level
        stable layer capped by an inversion, a well-mixed midtropospheric layer, and
        wind curvature from a low-level jet were found.<\/jats:p>","DOI":"10.1175\/mwr2932.1","type":"journal-article","created":{"date-parts":[[2005,6,24]],"date-time":"2005-06-24T18:46:34Z","timestamp":1119638794000},"page":"1525-1543","source":"Crossref","is-referenced-by-count":11,"title":["The
