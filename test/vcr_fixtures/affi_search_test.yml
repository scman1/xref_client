        of Sport and Physical Education, Novi Sad University","issue":"1","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["EQOL"],"published-print":{"date-parts":[[2024,6,15]]},"abstract":"<jats:p>\n                &amp;lt;p
        style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;In this article&amp;lt;strong&amp;gt;
        &amp;lt;\/strong&amp;gt;we reviewed the literature on injuries and their mechanisms
        in bodybuilders. Bodybuilding is a weightlifting sport where the main goal
        is to increase muscle mass while maitaining body symmetry. From a biomechanical
        point of view, it is important to analyse technical performance of exercises
        to improve sports technique. Compound exercises based on the development of
        muscle hypertrophy must be included. The training is different before and
        during season, in pre-season it is based on reduction of body fat to a low
        level and a high volume of aerobic exercise. Adequate nutrition, use of supplements
        and banned substances are widespread in the sport. In that case athletes should
        be very careful for banned substances in accordance with WADA Code. The most
        commonly performed exercises where injuries happen are the squat, deadlift
        and benchpress. The majority of injuries (60 %) are acute, with 93 % shoulder
        joint injuries, 85 % lower back injuries and 80 % knee injuries. The incidence
        of injuries is low compared to other sports, between 0.24\/1000 hours of training
        or 0.12 injuries per lifter per year. The most common type of injury is muscle
        strain, followed by tendinitis and cartilage wear. So it is therefore important
        to identify risk factors to allow the development of appropriate prevention
        programs. Muscle ruptures are common with high eccentric loads, with pectoralis
        major tendon being the most vulnerable to be injured. Than followed by a rupture
        of biceps femoris during the deadlift exercise, during sudden flexion of the
        hip joint while the knee is extended. Eccentric contraction and rupture also
        occurs in the quadriceps muscle, which lifters try to avoid by performing
        low-bar squat. Uncontrolled abdominal pressure during high-weight exercises
        causes discus hernias, which lifter can prevent by breathing correctly and
        using strong muscle stabilizers. The most well-known injury of all is elbow
        burzitis or &amp;amp;raquo;Bodybuilders elbow&amp;amp;laquo; due to repetitive
        flexion and extension movements of elbow joint. To prevent this injuries we
        have to include preventive measures such as medical check-ups, education of
        athletes, ensuring safety in competitions, appropriate training and load distribution,
        treating the body as a whole and regular equipment check-ups.&amp;lt;\/p&amp;gt;\n            <\/jats:p>","DOI":"10.31382\/eqol.240604","type":"journal-article","created":{"date-parts":[[2024,6,10]],"date-time":"2024-06-10T20:00:45Z","timestamp":1718049645000},"page":"41-48","source":"Crossref","is-referenced-by-count":1,"title":["Musculoskeletal
