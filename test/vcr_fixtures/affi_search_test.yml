        Technologies (Wolters Kluwer Health)","issue":"1","funder":[{"DOI":"10.13039\/100006108","name":"National
        Center for Advancing Translational Sciences","doi-asserted-by":"crossref","award":["UM1TR004409]."],"id":[{"id":"10.13039\/100006108","id-type":"DOI","asserted-by":"crossref"}]}],"content-domain":{"domain":["lww.com","ovid.com"],"crossmark-restriction":true},"published-print":{"date-parts":[[2025,1]]},"abstract":"<jats:sec>\n            <jats:title>Objectives:<\/jats:title>\n            <jats:p>This
        study explored the link between early sports specialization and injury rates
        in youth divers, a relationship that remains largely unexplored within diving.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Design:<\/jats:title>\n            <jats:p>Cross-sectional
        survey.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Setting:<\/jats:title>\n            <jats:p>Members
        of the USA Diving Organization and collegiate male and female divers participated
        in an online survey, reporting their sports involvement and injury history.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Participants:<\/jats:title>\n            <jats:p>One
        hundred eighty-two male and female divers aged 8 to 25 years were recruited
        through USA Diving or US collegiate team databases.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Independent
        Variables:<\/jats:title>\n            <jats:p>Early\/late specialization (based
        on age &lt;12 or 12 years or older), gender (M\/F), springboard and\/or platform
        divers, experience (junior\/senior, regional\/zone\/national\/international),
        hours of dryland\/water training, and prior sport exposure.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Main
        Outcome Measures:<\/jats:title>\n            <jats:p>Injury history obtained
        on questionnaire.<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Results:<\/jats:title>\n            <jats:p>One
        hundred eighty-two divers were surveyed; 70% female. Age to start diving and
        age to concentrate solely on diving were significantly associated with certain
        injuries (<jats:italic toggle=\"yes\">P<\/jats:italic> &lt; 0.05). Beginning
        diving before age 13 years of age was significantly associated with lower
        odds of injuries in the shoulder and wrist (<jats:italic toggle=\"yes\">P<\/jats:italic>
        = 0.013 and 0.018, respectively), after adjusting for select covariates. Age
        of specialization was not significantly associated with injuries in any body
        part (<jats:italic toggle=\"yes\">P<\/jats:italic> &gt; 0.05), after adjusting
        for covariates. Greater years of diving experience was significantly associated
        with diving injuries in all 11 body parts (<jats:italic toggle=\"yes\">P<\/jats:italic>
        &lt; 0.05).<\/jats:p>\n          <\/jats:sec>\n          <jats:sec>\n            <jats:title>Conclusions:<\/jats:title>\n            <jats:p>This
        study indicates that early sports specialization is associated with decreased
        injury rates in elite youth divers who specialized before age 13 years, particularly
        for head\/neck, shoulder, and wrist injuries. Moreover, we observed a positive
        correlation between experience and injury rate. Further investigation should
        focus on distinguishing between acute and overuse injuries.<\/jats:p>\n          <\/jats:sec>","DOI":"10.1097\/jsm.0000000000001239","type":"journal-article","created":{"date-parts":[[2024,6,25]],"date-time":"2024-06-25T19:35:22Z","timestamp":1719344122000},"page":"75-92","update-policy":"https:\/\/doi.org\/10.1097\/lww.0000000000001000","source":"Crossref","is-referenced-by-count":0,"title":["Diving
