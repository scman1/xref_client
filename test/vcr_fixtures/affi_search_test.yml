        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>The
        purpose of this project was to analyze children\u2019s literature on death
        and dying published between 2014-today. This project builds on previous research
        published prior to 2014. N = 40 books were reviewed for the following content:
        Biological facts including type of loss, emotional responses, socio-cultural
        practices and beliefs, and the number of euphemisms used. Books available
        from local libraries and Amazon were used for this project. Examples from
        each book were included in Excel and frequencies and percentages were summed
        after analysis. A total of 10 (25%) books included biological facts, such
        as \u201cheartbeat stops,\u201d 18 (45%) included emotional responses such
        as \u201cDad\u2019s eyes were red,\u201d and 8 (20%) included socio-cultural
        practices and beliefs such as \u201cwe all have beliefs and we don\u2019t
        know what happens when we die.\u201dA total of 5(8%) books included euphemistic
        terms such as \u201cgone to a better place\u201d for death. Overall, findings
        demonstrated that authors tended to write about emotional responses related
        to grief most often, whereas fewer wrote about socio-cultural practices and
        beliefs. Given the diversity and complexity of practices and beliefs on death
        and dying, additional children\u2019s books published in this area are needed
        to capture the diversity of experiences. While explaining death to children
        can be challenging, literature is a tool that parents can use to guide the
        conversation. However, not all children\u2019s books are created with the
        same intent, and it is important for adults to pre-screen books to determine
        how appropriate the book is for their child.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.3056","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T15:37:03Z","timestamp":1735745823000},"page":"948-948","source":"Crossref","is-referenced-by-count":1,"title":["A
        CONTENT ANALYSIS OF CHILDREN\u2019S LITERATURE ON DEATH AND DYING"],"prefix":"10.1093","volume":"8","author":[{"given":"Celine","family":"Manternach","sequence":"first","affiliation":[{"name":"University
