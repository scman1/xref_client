        Academic Excellence (M) Sdn Bhd","issue":"15","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["IJPPSW"],"abstract":"<jats:p>The
        14th General Election (GE-14) has successfully recorded its own history when
        the Pakatan Harapan (PH) coalition party has successfully captured the country
        and been appointed as the Federal Government. This means that the leadership
        of the Barisan Nasional (BN) Government, which has held the reins of government
        for 61 years, was successfully defeated in the historic GE-14. However, the
        government from PH has been shaken by the occurrence of the ''Sheraton Step''
        after GE-14 and the spread of the COVID-19 virus which has an impact on the
        country. Because of that, the issues that arose after GE-14 to some extent
        irritated them in the face of the country''s political instability. Therefore,
        the confidence of youth voters in PH shows that they expect the party to be
        able to make good changes to the country, especially from the socio-economic
        aspect and at the same time be able to overcome the issues that have arisen
        and the old issues that still cannot be resolved. The results found that youth
        voters'' confidence in the PH party is also high because they have lost faith
        in BN, but some are still divided on whether to choose this party in the future.<\/jats:p>","DOI":"10.35631\/ijppsw.615001","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T05:13:39Z","timestamp":1735708419000},"page":"01-19","source":"Crossref","is-referenced-by-count":0,"title":["THE
