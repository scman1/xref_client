        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:sec>\n                  <jats:title>Objective<\/jats:title>\n                  <jats:p>Cognitive
        impairment no dementia (CIND) classifications are susceptible to false positives
        and may not be indicative of progressive cognitive decline or dementia risk.
        The current project sought to investigate the dynamic nature of CIND across
        six years and to elucidate whether baseline impairment severity (single vs.
        multidomain impairment) predicts CIND stability patterns such as reversion
        and fluctuation between cognitive statuses. Method: Utilizing data from Project
        MIND, participants (N=259; 65-90 years) were classified as either Normal Cognition
        (NC) or CIND across five annual assessments using a battery of five cognitive
        tasks. Participants were classified as either Stable NC, Stable CIND, Progressors
        (NC\u2014CIND), Reverters (CIND\u2014NC) or Fluctuaters (CIND\u2014NC\u2014CIND)
        according to their across-time stability patterns. Participants initially
        classified as CIND were further subdivided based on impairment severity: single-task
        (CIND-S) or multiple-task (CIND-M) impairment. Multinomial logistic regression
        was utilized to explore whether baseline CIND severity differentiated Reverters
        and Fluctuaters from those who remained Stable CIND.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Results<\/jats:title>\n                  <jats:p>Most
        individuals were unstable in their CIND status for several years following
        baseline assessment. Compared to those classified as Stable CIND, Fluctuaters
        (-1.52, p=.01) and Reverters (-1.68, p=.01) were more likely to be classified
        as CIND-S (72% and 74%, respectively). Conclusions: Reverting back to NC or
        fluctuating between cognitive statuses is partly a function of instability
        in CIND-S classifications. Moving forward, CIND classifications could be improved
        through careful consideration of CIND severity at initial assessment. In particular,
        those classified as CIND-M may represent an at-risk group most likely to exhibit
        progressive cognitive impairment.<\/jats:p>\n               <\/jats:sec>","DOI":"10.1093\/geroni\/igae098.3190","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:54:29Z","timestamp":1735750469000},"page":"990-991","source":"Crossref","is-referenced-by-count":0,"title":["EXPLORING
        CIND STABILITY ACROSS TIME: INSIGHTS FOR IMPROVING COGNITIVE IMPAIRMENT CLASSIFICATIONS"],"prefix":"10.1093","volume":"8","author":[{"given":"Cynthia","family":"McDowell","sequence":"first","affiliation":[{"name":"University
        of Victoria , Victoria, British Columbia,","place":["Canada"]}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Nicholas","family":"Tamburri","sequence":"additional","affiliation":[{"name":"University
