        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>This
        study examines the expanding digital divide affecting older adults in the
        context of the COVID-19 pandemic. It focuses on exploring the factors that
        influence how older adults access information during COVID-19, emphasizing
        the challenges faced by those from disadvantaged backgrounds due to limited
        technology experience. Utilizing survey data conducted in May 2020 from the
        San Francisco Human Services Agency, which includes responses from 3,255 older
        adults in households receiving public benefits, this research employs logistic
        regression analysis to examine how demographic factors\u2014such as race\/ethnicity,
        education level, and primary language\u2014impact the ways in which older
        adults access information during the pandemic. The analysis encompasses a
        range of information sources, including both digital and traditional media,
        to uncover disparities in access. The results unveil stark disparities: Black
        older adults exhibited significantly lower odds of accessing information via
        online news and email compared to their White counterparts, indicating a pronounced
        digital exclusion. Conversely, Chinese older adults demonstrated a higher
        propensity for social media engagement, suggesting cultural and community-based
        differences in information dissemination preferences. Education emerged as
        a critical determinant, with older adults possessing less formal education
        showing diminished access to digital information sources. These nuanced findings
        highlight the critical need for targeted interventions aimed at bridging the
        digital divide. By tailoring educational and training initiatives to the unique
        needs of diverse older adult populations, the study underscores the importance
        of ensuring equitable access to essential information, thereby empowering
        all older adults to navigate public health crises more effectively.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2335","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:55:26Z","timestamp":1735743326000},"page":"716-716","source":"Crossref","is-referenced-by-count":0,"title":["OLDER
