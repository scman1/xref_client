        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Many
        dementia family caregivers experience persistent physical pain. In addition
        to compromising quality of life, caregivers\u2019 pain is associated with
        difficulty performing caregiving tasks and unmet needs in care recipients.
        This study developed a typology of care-related challenges that emerge as
        a consequence of pain among dementia family caregivers. We conducted semi-structured,
        in-depth interviews with 25 dementia family caregivers living with persistent
        pain. We inductively analyzed data via a thematic analysis approach to identify
        and categorize caregiving challenges stemming from caregivers\u2019 pain.
        We then analyzed how challenges were related to one another and their consequences
        for caregiving outcomes. Analysis revealed three interrelated categories of
        caregiving challenges: 1) physical (e.g., inability to lift person with dementia),
        2) psychological\/emotional (e.g., worry about future progression of care),
        and 3) family\/relational (e.g., resentment towards healthy family members
        for not helping with care). Caregivers reported that the co-occurrence of
        challenges compounded one another in ways that made both caregiving and pain
        management more difficult. For example, care recipients frequently became
        agitated when pain interfered with caregivers\u2019 ability to perform care
        tasks (a family\/relational challenge), which heightened caregivers\u2019
        negative emotions (a psychological\/emotional challenge). Whether caregivers
        reported challenges and whether each challenge was connected to caregiving
        outcomes was dependent on various contextual factors, such as whether caregivers
        reported benefits from their own pain (e.g., greater empathy). The resulting
        typology offers a theoretical framework to guide future translational research
        on the topic of caregivers\u2019 pain, including illuminating promising intervention
        targets of pain self-management programs for dementia family caregivers.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2737","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:23:37Z","timestamp":1735748617000},"page":"845-846","source":"Crossref","is-referenced-by-count":0,"title":["A
        TYPOLOGY OF CARE-RELATED CHALLENGES THAT EMERGE FROM DEMENTIA FAMILY CAREGIVERS\u2019
        PHYSICAL PAIN"],"prefix":"10.1093","volume":"8","author":[{"given":"Shelbie","family":"Turner","sequence":"first","affiliation":[{"name":"Weill
