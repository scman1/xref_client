        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:sec>\n                  <jats:title>Introduction<\/jats:title>\n                  <jats:p>Inappropriate
        prescription of medications is a problem of growing interest in geriatrics.
        Initiatives have been ongoing to evaluate interventions targeting the hazards
        of inappropriate prescription of medications; Deprescribing is one of these
        initiatives. However, no current study has examined medicine-related perceptions
        toward deprescribing inappropriate medications among older adults.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Methods<\/jats:title>\n                  <jats:p>A
        convenience sample of older adults who regularly visited the outpatient clinics
        during July 2023 for regular checkups were recruited. Data were collected
        by a graduate nursing student from one pharmacy located in a public hospital,
        five days per week, via in-person interviews using the Patient\u2019s Perceptions
        of Deprescribing survey.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Results<\/jats:title>\n                  <jats:p>The
        study found that older adults\u2019 perceived interest in stopping medications,
        belief about medicine overuse, the unimportance of medicines, and medication
        concerns are significantly associated with a variety of sociodemographic (e.g.,
        age), clinical (e.g., comorbidities), and PCP-related factors (e.g., knowledge
        of medications).<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Conclusion<\/jats:title>\n                  <jats:p>Inappropriate
        prescription of medication is one of the most common polypharmacy-related
        issues among older adults. The current study reported its findings on medicine-related
        perception toward deprescribing inappropriate medications among older adults.
        Care providers should discuss the benefits of deprescribing inappropriate
        medications with their patients to prevent the side effects associated with
        long-term unnecessary use. The long-term use of inappropriate medications
        by older adults should be carefully evaluated. Future studies on the effectiveness
        of an evidence-based deprescribing protocol on minimizing the clinical side
        effects associated with inappropriate prescription of medications among older
        adults are recommended.<\/jats:p>\n               <\/jats:sec>","DOI":"10.1093\/geroni\/igae098.2841","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T17:13:12Z","timestamp":1735751592000},"page":"879-879","source":"Crossref","is-referenced-by-count":0,"title":["OLDER
