        AG","issue":"1","license":[{"start":{"date-parts":[[2024,12,30]],"date-time":"2024-12-30T00:00:00Z","timestamp":1735516800000},"content-version":"vor","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["JCM"],"abstract":"<jats:p>Background\/Objectives:
        This study compares clinical and radiological outcomes of open microscopic
        posterior cervical foraminotomy (PCF) and biportal endoscopic spine surgery
        (BESS) PCF in multi-level cases. While BESS PCF is effective in single-level
        surgeries, its role in multi-level procedures remains unclear. Methods: This
        retrospective cohort study included 60 patients treated for cervical radiculopathy
        from 2016 to 2023, divided into two groups, open microscopic PCF (Group M,
        n = 30) and BESS PCF (Group B, n = 30). Clinical outcomes were assessed using
        visual analogue scale (VAS) scores for neck and arm pain and the neck disability
        index (NDI). Radiological parameters included cervical angle, segmental angle,
        range of motion (ROM), and the extent of facetectomy. Results: Both groups
        showed improvement in the arm pain VAS and the NDI. However, Group B exhibited
        significantly better neck pain on the VAS at the final follow-up (p = 0.03).
        Radiologically, Group B maintained lordotic cervical and segmental angles
        postoperatively, while Group M showed kyphotic changes (p &lt; 0.01). Segmental
        ROM was larger in Group M, indicating greater instability (p &lt; 0.01). Group
        B had less extensive facetectomy while achieving comparable foraminal enlargement.
        Operative time was longer for Group B (p &lt; 0.001). Conclusions: BESS PCF
        preserves cervical stability and reduces postoperative neck pain compared
        to open microscopic PCF in multi-level procedures. Despite longer operative
        times, its benefits in minimizing instability make it a promising option for
        treating multi-level cervical radiculopathy. Further research with long-term
        follow-up is recommended.<\/jats:p>","DOI":"10.3390\/jcm14010164","type":"journal-article","created":{"date-parts":[[2024,12,31]],"date-time":"2024-12-31T12:34:19Z","timestamp":1735648459000},"page":"164","source":"Crossref","is-referenced-by-count":0,"title":["Comparison
