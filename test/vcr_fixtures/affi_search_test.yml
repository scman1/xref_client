        Case Reports"],"published-print":{"date-parts":[[2025,1]]},"abstract":"<jats:sec><jats:title>Introduction<\/jats:title><jats:p>Renal
        artery pseudoaneurysm is a rare yet serious complication following percutaneous
        nephrolithotomy, especially in patients with solitary kidneys. Effective management
        is crucial to prevent further renal damage.<\/jats:p><\/jats:sec><jats:sec><jats:title>Case
        presentation<\/jats:title><jats:p>We report a case of a 41\u2010year\u2010old
        male with a solitary kidney who experienced gross hematuria and renal insufficiency
        3\u2009months after percutaneous nephrolithotomy. Due to the patient''s renal
        insufficiency and the risks associated with arterial catheterization, ultrasound\u2010guided
        embolization was chosen as the treatment approach. Initial angiographic attempts
        were impeded by renal vessel spasms, delaying intervention. However, successful
        direct percutaneous embolization was subsequently performed using ultrasound
        and digital subtraction angiography.<\/jats:p><\/jats:sec><jats:sec><jats:title>Conclusion<\/jats:title><jats:p>The
        patient''s recovery was uneventful, and follow\u2010up assessments showed
        no recurrence of renal artery pseudoaneurysm. This case highlights the effectiveness
        of ultrasound\u2010guided embolization as a viable treatment option for post\u2010percutaneous
        nephrolithotomy renal artery pseudoaneurysm, particularly in patients with
        solitary kidneys.<\/jats:p><\/jats:sec>","DOI":"10.1002\/iju5.12796","type":"journal-article","created":{"date-parts":[[2024,10,23]],"date-time":"2024-10-23T01:24:32Z","timestamp":1729646672000},"page":"19-23","update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":1,"title":["Ultrasound\u2010guided
        embolization for renal artery pseudoaneurysm in solitary kidney"],"prefix":"10.1002","volume":"8","author":[{"given":"Sana","family":"Augustine","sequence":"first","affiliation":[{"name":"Liaquat
        University of Medical and Health Sciences  Hyderabad Pakistan"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Mitwa","family":"Patel","sequence":"additional","affiliation":[{"name":"David
        Tvildiani Medical University  Tbilisi Georgia"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Pugazhendi","family":"Inban","sequence":"additional","affiliation":[{"name":"Government
