        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Prior
        research on racial\/ethnic and sex difference in late life cognitive trajectories
        has been limited by small sample sizes in clinical and survey cohorts. We
        overcome these challenges through leveraging real-world data for the U.S.
        Medicare beneficiary population to examine within-group differences in cognitive
        function trajectories and their predictors. Specifically, we found Black,
        Hispanic, and Asian American men and women have a higher risk of severe cognitive
        impairment and spend more months and years of their lives with significant
        cognitive impairment. These differences are largely driven by differences
        in the risk of cognitive impairment associated with older age, consistent
        with prior research on life course stress and the \u2018weathering\u2019 hypothesis
        that early health deterioration is a consequence of the cumulative impacts
        of social or economic adversity and political marginalization. Our findings
        replicate, and in some cases refute, findings from prior studies from smaller
        longitudinal cohorts, including the Health and Retirement Study. Results will
        be discussed from a life course perspective with attention to variation in
        environmental, sociocultural, political, and historical factors that create
        and sustain health disparities for racial\/ethnic minority older adults in
        the United States.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2184","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:44:17Z","timestamp":1735742657000},"page":"668-668","source":"Crossref","is-referenced-by-count":0,"title":["RACIAL\/ETHNIC
