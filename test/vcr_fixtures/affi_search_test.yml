        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:sec>\n                  <jats:title>Background<\/jats:title>\n                  <jats:p>Frailty
        is a geriatric syndrome of physical decline that increases an older adult\u2019s
        risk for vulnerability to physiological stress. We aim to determine the impact
        of social determinants of health (SDOH) on frailty trajectories of older adults
        in rural areas.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Methods<\/jats:title>\n                  <jats:p>We
        used data from the National Health and Aging Trend Study (2011-2020), a cohort
        of Medicare beneficiaries &amp;gt;65 years. Using cohorts from 2011 (n=8,245)
        and 2015 (n=8,334), individuals were categorized using Fried\u2019s frailty
        phenotype. Rurality was defined using the Office of Management and Budget\u2019s
        definition. Generalized estimation equations with generalized logit link function
        determined the impact of rurality and SDOH (transportation, family support,
        income, education) on frailty status.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Results<\/jats:title>\n                  <jats:p>Using
        the 2011 (n=8,245) and 2015 (n=8,334) cohorts, participants were 57.1% and
        55.8% female, median age 70-74 years old, and 18.5% and 19.3% lived in rural
        areas. Being married, having a college education, and higher income were protective
        against frailty progression. Urban areas had lower odds developing frailty
        versus pre-frailty, yet hastened developing pre-frailty versus robust. Urban
        adults with transportation to doctor appointments had lower odds of frailty
        progression, though not significant (robust-&amp;gt;frail (OR 0.80, SE 0.09,
        p=0.47) and robust-&amp;gt;pre-frail (OR 0.83, SE 0.08, p=0.49)). Hispanic
        ethnicity was protective against progressive frailty robust-&amp;gt;frail
        (OR 0.40, SE 0.14, p=0.008) or pre-frail-&amp;gt;frail (OR 0.55, SE 0.13,
        p=0.01).<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Conclusion<\/jats:title>\n                  <jats:p>Our
        findings suggest SDOH, race, and rurality may impact frailty trajectories.
        Future studies need to investigate the heterogeneity of aging in groups of
        older adults with similar SDOH and geography.<\/jats:p>\n               <\/jats:sec>","DOI":"10.1093\/geroni\/igae098.1710","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:29:06Z","timestamp":1735741746000},"page":"523-523","source":"Crossref","is-referenced-by-count":0,"title":["THE
