        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:sec>\n                  <jats:title>Purpose<\/jats:title>\n                  <jats:p>While
        the benefits of knowledge about health and preventive measures are widely
        acknowledged, little attention has been paid to the knowledge and attitudes
        of American Indian adults towards Alzheimer\u2019s Disease and other dementias
        (ADRD). Therefore, this study examines the attitudes towards Alzheimer\u2019s
        Disease and help-seeking intentions among American Indian adults, with a specific
        focus on gender differences. Method: Convenience sampling was used to recruit
        227 American Indian adults in the Northern Plains. We employed t-tests and
        chi-square tests to examine the differences in attitudes toward ADRD (including
        stigma, knowledge, and attitude) and help-seeking intentions by gender and
        generation (Millennial or Younger vs. Gen X or older).<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Results<\/jats:title>\n                  <jats:p>More
        than two-thirds of the participants showed signs of cognitive impairment.
        Among the respondents, 60% were female, and 54% had completed education beyond
        high school. Approximately 50% were from the Millennial or younger generation.
        Female American Indian adults were more likely to report higher levels of
        ADRD knowledge, positive attitudes toward ADRD, and help-seeking intentions
        compared to their male counterparts. No significant differences were found
        in attitudes and help-seeking intentions by generation.<\/jats:p>\n               <\/jats:sec>\n               <jats:sec>\n                  <jats:title>Conclusion<\/jats:title>\n                  <jats:p>The
        findings underscore the gender disparities in ADRD-related attitudes and help-seeking
        intentions among American Indian adults. Tailored educational support programs
        should account for these variations, focusing on strategies to encourage American
        Indian adults to seek an ADRD diagnosis.<\/jats:p>\n               <\/jats:sec>","DOI":"10.1093\/geroni\/igae098.3148","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:32:36Z","timestamp":1735749156000},"page":"977-978","source":"Crossref","is-referenced-by-count":0,"title":["ALZHEIMER\u2019S
