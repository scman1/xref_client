        j. surg."],"published-print":{"date-parts":[[1987,6]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p><jats:bold>Among
        454 operations done for peptic ulcer between 1956 and 1985 on residents of
        Rochester, Minnesota, U.S.A. in whom ulcer size could be determined accurately,
        50 operations (11% of the total) were performed for giant ulcers and 404 (89%)
        for nongiant ulcers. The annual operation rate per 100,000 residents for giant
        ulcer did not clearly decline during the 30\u2010year period in contrast to
        the dramatic fall in operation rates for nongiant ulcers. Nonetheless, the
        ratio of operation rates for giant ulcer compared to nongiant ulcer changed
        relatively little. Giant ulcers required emergency operation for massive bleeding
        more often than nongiant ulcers. Also, giant ulcers presented with unusual
        and severe complications such as gastrocolic fistula. Survival after surgery
        for giant ulcer was poorer than survival after an operation for nongiant ulcer.
        We conclude that giant ulcers are operated on somewhat less often today than
        in the past, while operations for nongiant ulcers are much less frequent.
        The giant ulcers that are operated on, however, are more prone to massive
        bleeding and are associated with poorer postoperative survival than their
        nongiant counterparts<\/jats:bold>.<\/jats:p>","DOI":"10.1007\/bf01658111","type":"journal-article","created":{"date-parts":[[2005,5,8]],"date-time":"2005-05-08T09:13:50Z","timestamp":1115543630000},"page":"333-338","source":"Crossref","is-referenced-by-count":16,"title":["Giant
        gastric and duodenal ulcers: A population\u2010based study with a comparison
        to nongiant ulcers"],"prefix":"10.1002","volume":"11","author":[{"given":"Sven","family":"Gustavsson","sequence":"first","affiliation":[{"name":"Gastroenterology
        Unit Department of Surgery, and Department of Medical Statistics and Epidemiology
        Mayo Clinic and Foundation Rochester Minnesota USA"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Keith
