        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Hispanics
        play a significant role in the self-employment landscape among older workers,
        yet research on this subject often ignores intragroup heterogeneity. Investigating
        these intragroup differences may highlight differential access to safety-net
        programs (e.g., health insurance, retirement savings programs) and economic
        opportunities (e.g., business incorporation). In response, this study utilized
        data from the Current Population Survey Annual Social and Economic Supplement,
        obtained from IPUMS-CPS, to assess differences in incorporated (I-SE) and
        unincorporated (U-SE) self-employment rates among those 50 to 64 years old
        by seven Hispanic subgroups within the U.S. (Mexican, Puerto Rican, Cuban,
        Dominican, Salvadoran, Central and South American, and Other Hispanic). Using
        pooled data between 2017 and 2022 to reduce sampling noise, we estimated health
        insurance access, retirement savings program access, and citizenship status
        by subgroup and incorporation status. We found notable differences by subgroup
        in overall self-employment rates (e.g., Cubans had the highest rates: 5% I-SE,
        6% U-SE%; Puerto Ricans had the lowest rates: 2% I-SE, 2% U-SE). Salvadorans
        had the lowest health insurance coverage rates (48% I-SE, 58% U-SE). Those
        falling within the \u201cOther Hispanic\u201d category, including Spaniards,
        participated the most in workplace retirement savings programs (26% I-SE,
        7% U-SE). Excluding Puerto Ricans, who are U.S. citizens, Dominicans in unincorporated
        self-employment (46% citizens) and Salvadorans in incorporated self-employment
        (41% citizens) were the least likely to hold citizenship status. These findings
        identify important gaps in access to health insurance and retirement savings
        programs, as well as more lucrative incorporated self-employment opportunities,
        by subgroup.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.1732","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T15:13:19Z","timestamp":1735744399000},"page":"530-530","source":"Crossref","is-referenced-by-count":0,"title":["SELF-EMPLOYMENT
        AMONG OLDER HISPANICS: INTRAGROUP DIVERSITY, WORKPLACE BENEFITS, AND CITIZENSHIP
        STATUS"],"prefix":"10.1093","volume":"8","author":[{"given":"Bruna","family":"Lopez","sequence":"first","affiliation":[{"name":"Boston
        College , Chestnut Hill, Massachusetts, United States"}],"role":[{"role":"author","vocabulary":"crossref"}]}],"member":"286","published-online":{"date-parts":[[2024,12,31]]},"container-title":["Innovation
