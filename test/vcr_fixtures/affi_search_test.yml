        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>An
        unintended side-effect of the COVID-19 pandemic has been changes in lifestyle
        factors which impact middle-aged and older adult cognition \u2013 including
        changes in 24-hour behaviours (i.e., physical activity, sedentary behaviour,
        and sleep). In a longitudinal analysis of the Canadian Longitudinal Study
        on Aging (CLSA) tracking cohort, we explored age- and sex-differences in the
        effects of the COVID-19 pandemic on cognition and 24-hour behaviours, and
        whether pandemic-related changes in 24-hour behaviours and cognition are associated.
        We included cognitively healthy participants at baseline (2012-2105), follow-up
        1 (FU1; 2015-2018), and follow-up 2 (FU2; 2018-2021), with complete neuropsychological
        testing data (N=11,355). Cognition and 24-hour behaviours were indexed at
        each timepoint. Participants were categorized into pre-pandemic (N=6,174)
        and post-pandemic (N=5,181) cohorts based on whether FU2 assessments occurred
        before or after COVID-19 pandemic onset (March 11th, 2020). We examined time
        x cohort changes in cognition and 24-hour behaviours from FU1 to FU2, and
        if changes in 24-hour behaviours from FU1 to FU2 were associated with changes
        in cognition. All models were allowed to vary by age and sex. Our results
        indicated that post-pandemic cohort males and females aged 65+ years had significantly
        worse cognition and poorer 24-hour behaviours from FU1 to FU2 than their peers
        in the pre-pandemic cohort (p\u2019s&amp;lt; 0.05). However, changes in 24-hour
        behaviours from FU1 to FU2 were unassociated with changes in cognition, irrespective
        of age or sex. Our results highlight that the pandemic negatively impacted
        24-hour behaviours and cognition in older adults \u2013 although these effects
        may be unassociated with each other.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2343","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:48:02Z","timestamp":1735742882000},"page":"718-718","source":"Crossref","is-referenced-by-count":0,"title":["UNMASKING
        THE CONSEQUENCES OF THE COVID-19 PANDEMIC ON COGNITION AND 24-HOUR BEHAVIORS:
        INSIGHTS FROM THE CLSA"],"prefix":"10.1093","volume":"8","author":[{"given":"Ryan","family":"Falck","sequence":"first","affiliation":[{"name":"University
        of British Columbia , Vancouver, British Columbia,","place":["Canada"]}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Teresa","family":"Liu-Ambrose","sequence":"additional","affiliation":[{"name":"University
