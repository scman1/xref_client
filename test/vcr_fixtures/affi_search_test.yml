        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>The
        Freedman\u2019s Savings Bank was chartered in 1865 to serve newly emancipated
        people across 17 states. Driven by mismanagement and fraud by the bank\u2019s
        white officials, the bank failed in 1874 \u2500 costing many depositors large
        savings. Although there is debate about the short-term financial benefits
        for Black people of the bank\u2019s creation, there has been no research on
        the longer-term effects of the bank\u2019s failure on social, economic, or
        mortality outcomes among depositors who lost their savings. Using linked records
        from the complete-count 1860 through 1940 U.S. Censuses and exceptionally
        detailed records on the bank\u2019s branches, deposits, and losses, we use
        a variety of empirical estimation strategies to estimate the effects of the
        bank\u2019s failure on the life course outcomes of Black depositors and their
        children. This work speaks more broadly to the effects of negative economic
        shocks on the long-term well-being of older people.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.1751","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:34:51Z","timestamp":1735742091000},"page":"535-535","source":"Crossref","is-referenced-by-count":0,"title":["THE
        SOCIAL, ECONOMIC, AND MORTALITY CONSEQUENCES OF THE FAILURE OF THE FREEDMAN\u2019S
        SAVINGS BANK"],"prefix":"10.1093","volume":"8","author":[{"given":"John","family":"Warren","sequence":"first","affiliation":[{"name":"University
        of Minnesota , Minneapolis, Minnesota, United States"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"Jonas","family":"Helgertz","sequence":"additional","affiliation":[{"name":"Lund
