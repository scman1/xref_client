        Bot. Bras."],"published-print":{"date-parts":[[2004,3]]},"abstract":"<jats:p>Foi
        realizado o estudo da anatomia foliar de Alpinia zerumbet (Pers.) Burtt &amp;
        Smith, esp\u00e9cie da fam\u00edlia Zingiberaceae, coletada no Horto Bot\u00e2nico
        da Quinta da Boa Vista, S\u00e3o Crist\u00f3v\u00e3o, Rio de Janeiro, RJ.
        A esp\u00e9cie \u00e9 vulgarmente conhecida como col\u00f4nia, destacando-se
        pela beleza de suas infloresc\u00eancias e pelo valor medicinal que lhe \u00e9
        atribu\u00eddo. O presente estudo tem como objetivo fornecer dados que possam
        contribuir para a compreens\u00e3o das caracter\u00edsticas morfol\u00f3gicas
        da esp\u00e9cie e da taxonomia da fam\u00edlia. Anatomicamente a folha apresenta
        organiza\u00e7\u00e3o dorsiventral do mesofilo, car\u00e1ter n\u00e3o peculiar
        \u00e0 maioria das monocotiled\u00f4neas, e pela ocorr\u00eancia de c\u00e9lulas
        ole\u00edferas dispersas no mesofilo e na epiderme da face abaxial. A folha
        \u00e9 anfiestom\u00e1tica e apresenta hipoderme em ambas as faces.<\/jats:p>","DOI":"10.1590\/s0102-33062004000100010","type":"journal-article","created":{"date-parts":[[2005,5,12]],"date-time":"2005-05-12T19:49:07Z","timestamp":1115927347000},"page":"109-121","source":"Crossref","is-referenced-by-count":14,"title":["Anatomia
