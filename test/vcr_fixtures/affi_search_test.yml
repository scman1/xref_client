        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Caregiving
        is generally altruistic in South Asian (SA) communities; however, caregiving
        activities can still create significant strain for caregivers depending on
        situational factors, including sleep and built environments (Hossain et al.,
        2020). Particularly, long-distance caregivers may grapple with the added complexities
        of not being physically present to provide care. This study utilized an online
        survey to investigate sleep habits and routines, caregiving activities, neighborhood
        satisfaction, and access to community resources for the SA community located
        in Omaha, Nebraska (N=74, MAge=25.8, SD=4.58). Caregivers reported on their
        perceived burdens, highlighting the unique challenges faced as they logistically
        navigate from afar, which remains underrepresented in research for the SA
        community (Hossein et al., 2020). Results revealed that SA caregivers\u2019
        sleep satisfaction was significantly related to caregiver responsibilities,
        including familial and professional expectations (\u03c72(6, N=74)=20.74,p&amp;lt;.05).
        Caregivers concerned about their sleep patterns were significantly more likely
        to have impaired quality of life (r(72)=0.62, p&amp;lt;.001). Self-rated home
        cleanliness was also considerable in caregivers\u2019 controlling their bedtime
        (r(72)=0.36, p&amp;lt;.001). Thus, control over sleep length and quality are
        essential factors to reduce caregiver burden. This highlights that how better
        sleep habits and a clean surrounding environment can potentially reduce strain
        experienced by many long-distance caregivers. The impact of home environments
        for the long-distance SA caregiving community is yet to be fully understood.
        It would be valuable to investigate this community\u2019s caregiver norms
        and cultural expectations further to promote environments conducive to sleep
        quality and overall quality of life.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.3118","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T15:59:29Z","timestamp":1735747169000},"page":"968-968","source":"Crossref","is-referenced-by-count":0,"title":["BEYOND
