        AG","issue":"1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Medicina"],"abstract":"<jats:p>Background
        and Objectives: To assess pregnancy and delivery complications in obese women
        with gestational diabetes mellitus (GDM) and neonatal weight and condition
        after birth. Materials and Methods: A retrospective tertiary referral centre
        study included all cases of GDM in the Department of Obstetrics and Gynaecology
        of the Lithuanian University of Health Sciences (LUHS) Birth Registry from
        1 January 2019 to 31 December 2019. We included 583 women with GDM and singleton
        pregnancies. Women were divided into two groups according to their pre-pregnancy
        weight: 202 were obese (BMI \u2265 30 kg\/m2), and 381 were weight (BMI 18.5\u201324.9
        kg\/m2). Survey data were analysed using IBM SPSS Statistics 26.0 and MS Excel
        2016 software. A value of p &lt; 0.05 was considered significant. Results:
        Fasting glycaemia was significantly higher in obese women with GDM than in
        normal-weight women with GDM (p &lt; 0.001). In addition, fasting glycaemia
        was higher in obese women with GDM requiring insulin correction than in normal-weight
        women (p = 0.006). OGTT 0-min glycaemia was higher in obese than in non-obese
        women with gestational diabetes (p &lt; 0.001). Women with pre-pregnancy obesity
        had a higher incidence of primary hypertension (p &lt; 0.001), hypertensive
        disorders in pregnancy (p &lt; 0.001), gestational cholestasis (p = 0.002),
        polyhydramnios (p &lt; 0.001), induced labour (p &lt; 0.001), and caesarean
        section (p = 0.015), with emergency caesarean sections being more frequent
        than planned caesarean sections (p = 0.011) compared to normal-weight women
        with GDM. Labour dystocia (p = 0.003) and foetal distress (p = 0,019) were
        more common during labour in obese women. Neonates of these women more often
        had macrosomia (p &lt; 0.001) and lower Apgar scores at 1 min (p = 0.024)
        and at 5 min (p = 0.024) compared to neonates of normal-weight women. Conclusions:
        Obese women with GDM experience more pregnancy complications than normal-weight
        women with GDM.<\/jats:p>","DOI":"10.3390\/medicina61010051","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:24:19Z","timestamp":1735748659000},"page":"51","source":"Crossref","is-referenced-by-count":0,"title":["Pregnancy
