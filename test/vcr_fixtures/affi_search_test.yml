        Academic Excellence (M) Sdn Bhd","issue":"36","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["JISTM"],"abstract":"<jats:p>The
        use of Failure Mode and Effect Analysis (FMEA) has become widespread in various
        industries to address quality and reliability issues that may occur in a system
        or process. However, the risk assessment process using traditional FMEA is
        very time-consuming because it requires the evaluator to assess the risk for
        each identified potential failure mode one by one, based on the extracted
        historical data. Without proper consideration of the system or process being
        evaluated, the evaluator may make incorrect judgments, causing the FMEA results
        to be inaccurate and unreliable. In this study, an interactive FMEA tool that
        uses a standard risk factor input as the main reference was developed using
        Excel software and Tableau software. Semi-structured interviews were conducted
        at the initial stage of the study to obtain basic information about the existing
        FMEA approach in the semiconductor industry. With this information, a standard
        reference for risk factor input was established for the FMEA tool. The developed
        tool was then tested in the real semiconductor industry to validate its effectiveness
        and practicality. The results show that the developed interactive FMEA tool
        holds significant potential for industrial usage in terms of streamlining
        the FMEA analysis process, providing a comprehensive visualization of the
        identified potential failure modes, and improving information sharing within
        the organization. With the presence of this interactive FMEA tool, users can
        not only produce more accurate and reliable FMEA results based on built-in
        risk factor input standards, users can also view the generated FMEA results
        online through the Tableau dashboard.<\/jats:p>","DOI":"10.35631\/jistm.936006","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T04:58:53Z","timestamp":1735707533000},"page":"90-108","source":"Crossref","is-referenced-by-count":0,"title":["DESIGN
