        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>In
        a nursing home (NH) or assisted living (AL), residents require assistance
        with activities of daily living and many of these residents also have cognitive
        impairments associated with dementia. As a result, many NHs and ALs have created
        dedicated memory care units (MCUs). This paper contributes to the literature
        on staffing in NHs and ALs by examining staffing levels for licensed nurses
        and other direct care staff for the overall facility and the 1 in 4 facilities
        that have MCUs on different shifts: day, evening, night. Data for this study
        come from the 2021 Ohio Biennial Survey of Long-Term Care Facilities. Staffing
        levels by shift were calculated as resident to staff ratios, which is the
        number of residents compared to number of staff by shift. Findings show that
        both NHs and ALs have their lowest resident-to-staff ratios, and hence most
        staff on the day shift (16.0 and 24.2 for licensed nurses and 10.4 and 14.2
        for direct care staff, respectively). In both settings, the night shift staffing
        had the highest staffing ratios. Comparing the overall NH staffing to AL staffing,
        NHs have more staff per resident. However, on the MCU, NHs and ALs had more
        similar staffing levels. This suggests that NHs and ALs staff MCUs in a similar
        manner, but outside of the MCU, nursing homes staff better than ALs. The evidence
        can be used for decision making about future staffing policies.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.2802","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T16:55:06Z","timestamp":1735750506000},"page":"866-867","source":"Crossref","is-referenced-by-count":0,"title":["STAFFING
        LEVELS IN OHIO\u2019S NURSING HOMES, ASSISTED LIVINGS, AND MEMORY CARE UNITS:
        SHIFT VARIATION"],"prefix":"10.1093","volume":"8","author":[{"given":"Matt","family":"Nelson","sequence":"first","affiliation":[{"name":"Miami
        University , Oxford, Ohio, United States"}],"role":[{"role":"author","vocabulary":"crossref"}]},{"given":"John","family":"Bowblis","sequence":"additional","affiliation":[{"name":"Miami
