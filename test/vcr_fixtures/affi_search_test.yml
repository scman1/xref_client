        Neuro-Psiquiatr."],"published-print":{"date-parts":[[1999,9]]},"abstract":"<jats:p>OBJETIVO:
        Identificar em nossa sociedade as etiologias mais prov\u00e1veis de epilepsia
        iniciada ap\u00f3s os 18 anos de idade. M\u00c9TODO: Estudo retrospectivo
        e descritivo na CME\/SUS de Florian\u00f3polis de 1990 \u00e0 1998, analisando
        120 prontu\u00e1rios de pacientes com epilepsia tardia, isto \u00e9, aqueles
        que iniciaram suas crises epil\u00e9pticas dos 18 anos em diante. As vari\u00e1veis
        coletadas foram: idade da primeira crise, etiologias prov\u00e1veis, hist\u00f3ria
        m\u00f3rbida familiar. RESULTADOS: A preval\u00eancia encontrada para epilepsia
        tardia foi 29,48%.Epilepsias parciais sintom\u00e1ticas foram majorit\u00e1rias
        e as etiologias mais frequentes e relevantes encontradas foram: cisticercose
        com cerca de 20%, trauma cr\u00e2nio encef\u00e1lico com 15%, convuls\u00e3o
        febril na inf\u00e2ncia com 5% e 35% da amostra foi classificada como idiop\u00e1tica.
        CONCLUS\u00c3O: preval\u00eancia de epilepsia de in\u00edcio tardio em nossa
        sociedade \u00e9 29,48%, cifra ligeiramente superior \u00e0 relatada em pa\u00edses
        desenvolvidos (25%). Muito provavelmente, esta diferen\u00e7a \u00e9 consequ\u00eancia
        do car\u00e1ter epid\u00eamico de cisticercose entre n\u00f3s. Al\u00e9m disso,
        trauma cr\u00e2nio encef\u00e1lico e crises febris s\u00e3o etiologias comuns.
        Profilaxia de epilepsia \u00e9 vi\u00e1vel e urgentemente necess\u00e1ria
        em nosso Estado.<\/jats:p>","DOI":"10.1590\/s0004-282x1999000500009","type":"journal-article","created":{"date-parts":[[2005,5,12]],"date-time":"2005-05-12T20:22:10Z","timestamp":1115929330000},"page":"787-792","source":"Crossref","is-referenced-by-count":10,"title":["Causas
