        University Press (OUP)","issue":"Supplement_1","license":[{"start":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T00:00:00Z","timestamp":1735689600000},"content-version":"vor","delay-in-days":31,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2024,12,31]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>Our
        AFU dedicated team first met in August, 2022 to discuss the process for becoming
        an Age-Friendly University. The AFU team consisted of a psychology department
        faculty member, the director of the university\u2019s Lifelong Learning Program,
        and a local community member. Our first step was to map our university\u2019s
        core values and current age-friendly inclusive activities onto the 10 Principles
        of an Age-Friendly University. This exercise provided evidence that many ongoing,
        university-engaging events highlighted four of the Age-Friendly principles.
        In October, 2022, the team met with our provost and proposed why Shepherd
        University should endorse the Age-Friendly initiative. Our provost agreed
        and signed our application letter in November, 2022. With the Age-Friendly
        University Global Network restructuring, it was a rather long wait for their
        response but we received our acceptance letter in August, 2023. We sent out
        press releases and were interviewed by a local columnist. Our first step as
        an AFU member was to create a six-person AFU Advisory Board with representation
        from Shepherd faculty, staff, and community members. We meet monthly and are
        currently working on a mission statement, by-laws, and S.W.O.T. analysis.
        We are also conducting information sessions for the university community to
        inform them about AFU and receive input on potential age-friendly activities.
        The board is keeping a log of activities undertaken as required by the AFU
        Global Network.<\/jats:p>","DOI":"10.1093\/geroni\/igae098.1758","type":"journal-article","created":{"date-parts":[[2025,1,1]],"date-time":"2025-01-01T14:47:27Z","timestamp":1735742847000},"page":"537-537","source":"Crossref","is-referenced-by-count":0,"title":["SHEPHERD
        UNIVERSITY\u2019S ROADMAP TO AGE-FRIENDLY UNIVERSITY DESIGNATION"],"prefix":"10.1093","volume":"8","author":[{"given":"Heidi","family":"Dobish","sequence":"first","affiliation":[{"name":"Shepherd
