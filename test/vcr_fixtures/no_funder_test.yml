        Engineering and Physical Sciences Research Council (EPSRC)","doi-asserted-by":"crossref","award":["EP\/L014912\/1","EP\/T517860\/1"],"id":[{"id":"10.13039\/501100000266","id-type":"DOI","asserted-by":"crossref"}]},{"name":"the
        UK Catalysis Hub EPSRC","award":["EP\/K014714\/1"]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Energies"],"abstract":"<jats:p>The
        integration of hydrothermal carbonisation (HTC) and anaerobic digestion (AD)
        can overcome some of the disadvantages of thermal or biological processing
        alone. This study aims to investigate integrated HTC-AD across a range of
        integration strategies and HTC processing temperatures (150 \u00b0C, 200 \u00b0C
        and 250 \u00b0C) to improve the energy conversion efficiency (ECE) of grass,
        compared to AD alone. The separation of hydrochars (HCs) for combustion and
        process waters (PWs) for digestion appears to be the most energetically feasible
        HTC-AD integration strategy, compared to HC or HTC-slurry AD. Hydrochars represent
        the greater energy carrier with between 81\u201385% of total energy output.
        The ECE of grass was improved from 51% to 97% (150 \u00b0C), 83% (200 \u00b0C)
        and 68% (250 \u00b0C) through integrated HTC-AD. Therefore, lower HTC processing
        temperatures yield more favourable energetics. However, higher HTC temperatures
        favour more desirable HC properties as a combustion fuel. The hydrochar produced
        at 250 \u00b0C (HC-250) displayed the highest HHV (25.8 MJ\/kg) and fixed
        carbon: volatile matter ratio (0.47), as well as the greatest reduction in
        slagging and fouling potential (ash flow temperature &gt; 1550 \u00b0C). Overall,
        integrated HTC-AD is an effective energy valorisation strategy for grass.
        A compromise exists between the quality of hydrochar and the energetic balance.
        However, at 250 \u00b0C the process remains energetically feasible (EROI =
        2.63).<\/jats:p>","DOI":"10.3390\/en15103495","type":"journal-article","created":{"date-parts":[[2022,5,10]],"date-time":"2022-05-10T12:31:55Z","timestamp":1652185915000},"page":"3495","source":"Crossref","is-referenced-by-count":11,"title":["Integration
