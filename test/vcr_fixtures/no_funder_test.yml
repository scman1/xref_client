        cells sealed with photoelectron\u2010transparent graphene windows are promising
        for extending X\u2010ray photoelectron spectroscopy (XPS) to liquid and high\u2010pressure
        gas environments for <jats:italic>in\u2005situ<\/jats:italic> and <jats:italic>operando<\/jats:italic>
        studies. However, the reliable production of graphene windows that are sufficiently
        leak\u2010tight for extended measurements remains a challenge. Here we demonstrate
        a PDMS\/Au(100\u2005nm)\u2010supported transfer method that reliably produces
        suspended graphene on perforated silicon nitride membranes without significant
        contamination. A yield of ~95\u2009% is achieved based on single\u2010layer
        graphene covering &gt;98\u2009% of the holes in the silicon nitride membrane.
        Even higher coverages are achieved for stacked bilayer graphene, allowing
        wet etching (aqueous KI\/I<jats:sub>2<\/jats:sub>) of the Au support to be
        observed in a conventional lab\u2010based XPS system, thereby demonstrating
        the <jats:italic>in\u2005situ<\/jats:italic> formation of leak\u2010tight,
        suspended graphene windows. Furthermore, these windows allow gas\u2010phase
        measurements at close to atmospheric pressure, showing future promise for
        XPS under higher\u2010pressure gas environments in conventional lab\u2010based
        systems.<\/jats:p>","DOI":"10.1002\/cctc.202400239","type":"journal-article","created":{"date-parts":[[2024,4,22]],"date-time":"2024-04-22T02:55:10Z","timestamp":1713754510000},"update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":0,"title":["In
