        Catalyst Hub (EPSRC)","award":["EP\/K014714\/1"]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Catalysts"],"abstract":"<jats:p>The
        presence of inorganic salts either as part of the substrate or added to the
        reaction medium are known to significantly affect the reaction pathways during
        hydrothermal carbonisation (HTC) of biomass. This work aims to understand
        the influence of salts on hydrothermal carbonisation by processing cellulose
        in the presence of one or more inorganic salts with different valency. Batch
        experiments and Differential Scanning Calorimetry were used to investigate
        the change in reaction pathways during hydrothermal conversion. The effect
        of salts on the rate of HTC of cellulose can be correlated with the Lewis
        acidity of the cation and the basicity of the anion. The effect of the anion
        was more pH-dependent than the cation because it can protonate during the
        HTC process as organic acids are produced. The introduction of salts with
        Lewis acidity increases the concentration of low molecular weight compounds
        in the process water. The addition of a second salt can influence the catalytic
        effect of the first salt resulting in greater levulinic acid yields at the
        expense of hydrochar formation. Salts also play an important role in cellulose
        dissolution and can be used to modify the yield and composition of the hydrochars.<\/jats:p>","DOI":"10.3390\/catal12050492","type":"journal-article","created":{"date-parts":[[2022,4,28]],"date-time":"2022-04-28T16:06:01Z","timestamp":1651161961000},"page":"492","source":"Crossref","is-referenced-by-count":13,"title":["Inorganic
