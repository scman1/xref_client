        and Physical Sciences Research Council (EPSRC)","doi-asserted-by":"crossref","award":["EP\/I038748\/1","EP\/I019693\/1","EP\/K014706\/1","EP\/K014668\/1","EP\/K014854\/1","EP\/K014714\/1","EP\/M013219\/1"],"id":[{"id":"10.13039\/501100000266","id-type":"DOI","asserted-by":"crossref"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Catalysts"],"abstract":"<jats:p>A
        MoOx\/Al2O3 catalyst was synthesised and tested for oxidative (ODP) and non-oxidative
        (DP) dehydrogenation of propane in a reaction cycle of ODP followed by DP
        and a second ODP run. Characterisation results show that the fresh catalyst
        contains highly dispersed Mo oxide species in the +6 oxidation state with
        tetrahedral coordination as [MoVIO4]2\u2212 moieties. In situ X-ray Absorption
        Spectroscopy (XAS) shows that [MoVIO4]2\u2212 is present during the first
        ODP run of the reaction cycle and is reduced to MoIVO2 in the following DP
        run. The reduced species are partly re-oxidised in the subsequent second ODP
        run of the reaction cycle. The partly re-oxidised species exhibit oxidation
        and coordination states that are lower than 6 but higher than 4 and are referred
        to as MoxOy. These species significantly improved propene formation (relatively
        27% higher) in the second ODP run at similar propane conversion activity.
        Accordingly, the initial tetrahedral [MoVIO4]2\u2212 present during the first
        ODP run of the reaction cycle is active for propane conversion; however, it
        is unselective for propene. The reduced MoIVO2 species are relatively less
        active and selective for DP. It is suggested that the MoxOy species generated
        by the reaction cycle are active and selective for ODP. The vibrational spectroscopic
        data indicate that the retained surface species are amorphous carbon deposits
        with a higher proportion of aromatic\/olefinic like species.<\/jats:p>","DOI":"10.3390\/catal10121370","type":"journal-article","created":{"date-parts":[[2020,11,25]],"date-time":"2020-11-25T01:50:22Z","timestamp":1606269022000},"page":"1370","source":"Crossref","is-referenced-by-count":9,"title":["Investigation
