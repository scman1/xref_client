        Trans. R. Soc. A."],"published-print":{"date-parts":[[2020,7,24]]},"abstract":"<jats:p>\n                    Circular
        economy emphasizes the idea of transforming products involving economic growth
        and improving the ecological system to reduce the negative consequences caused
        by the excessive use of raw materials. This can be achieved with the use of
        second-generation biomass that converts industrial and agricultural wastes
        into bulk chemicals. The use of catalytic processes is essential to achieve
        a viable upgrade of biofuels from the lignocellulosic biomass. We carried
        out density functional theory calculations to explore the relationship between
        13 transition metals (TMs) properties, as catalysts, and their affinity for
        hydrogen and oxygen, as key species in the valourization of biomass. The relation
        of these parameters will define the trends of the hydrodeoxygenation (HDO)
        process on biomass-derived compounds. We found the hydrogen and oxygen adsorption
        energies in the most stable site have a linear relation with electronic properties
        of these metals that will rationalize the surface''s ability to bind the biomass-derived
        compounds and break the C\u2013O bonds. This will accelerate the catalyst
        innovation for low temperature and efficient HDO processes on biomass derivates,
        e.g. guaiacol and anisole, among others. Among the monometallic catalysts
        explored, the scaling relationship pointed out that Ni has a promising balance
        between hydrogen and oxygen affinities according to the\n                    <jats:italic>d<\/jats:italic>\n                    -band
        centre and\n                    <jats:italic>d<\/jats:italic>\n                    -band
        width models. The comparison of the calculated descriptors to the adsorption
        strength of guaiacol on the investigated surfaces indicates that the\n                    <jats:italic>d<\/jats:italic>\n                    -band
        properties alone are not best suited to describe the trend. Instead, we found
        that a linear combination of work function and\n                    <jats:italic>d<\/jats:italic>\n                    -band
        properties gives significantly better correlation.\n                  <\/jats:p>\n                  <jats:p>This
        article is part of a discussion meeting issue \u2018Science to enable the
        circular economy\u2019.<\/jats:p>","DOI":"10.1098\/rsta.2020.0056","type":"journal-article","created":{"date-parts":[[2020,7,5]],"date-time":"2020-07-05T19:05:20Z","timestamp":1593975920000},"page":"20200056","update-policy":"https:\/\/doi.org\/10.1098\/crossmark-policy","source":"Crossref","is-referenced-by-count":8,"title":["Biomass
