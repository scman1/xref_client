        and Biological Sciences Research Council","doi-asserted-by":"publisher","award":["BB\/M026280\/1"],"award-info":[{"award-number":["BB\/M026280\/1"]}],"id":[{"id":"10.13039\/501100000268","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"abstract":"<jats:p>The
        active site architecture of heme enzymes has evolved to control the formation
        of highly reactive intermediates for oxidative catalysis. Finely tuned proton
        delivery to heme is essential, yet the mechanisms of proton delivery and the
        sources of protons are poorly understood. Here, we identify routes and drivers
        of proton delivery in a heme peroxidase enzyme (ascorbate peroxidase) employing
        a range of computational molecular modeling approaches, including molecular
        dynamics (MD) simulations, density functional theory (DFT) and combined quantum
        mechanics\/molecular mechanics (QM\/MM) calculations, enhanced sampling techniques,
        and local electric field (LEF) analyses. Our results show that networks of
        active site water molecules facilitate proton ex-change with Arg38, which
        may serve as a transient proton carrier at the \u03b3-edge of the heme, where
        the substrate (ascorbate) binds. The distal His42 residue aids proton transfer
        into the active site via solvent from the \u03b4-heme edge. MD simulations
        of three peroxidases identify hydrated channels in the structure \u2013 pointing
        towards both the \u03b3- and \u03b4-edges of the heme \u2013 through which
        protons from solvent can access the active site. Comparison with structures
        of 8 other heme peroxidases shows that these channels are conserved features.
        LEF calculations show a continuous electrostatic funnel, running from positive
        to negative, that pulls protons from the protein surface along the channels
        towards the heme iron from both the \u03b3- and \u03b4-heme edges. This electric
        field is also found to be a conserved feature in several peroxidases; its
        direction and shape is conserved but the gradient varies between differ-ent
        enzymes, suggesting that nature preorganises the electric field as a determinant
        of relative activity. Rather than a simplistic model for proton delivery (in
        which a single substrate provides a single proton (and an electron) to the
        heme) the data instead show conserved solvent channels and electrostatic funnels,
        which provide multiple well defined routes for proton delivery in peroxidase
        catalysis.<\/jats:p>","DOI":"10.26434\/chemrxiv-2024-rjrnd-v2","type":"posted-content","created":{"date-parts":[[2025,8,12]],"date-time":"2025-08-12T11:59:45Z","timestamp":1754999985000},"source":"Crossref","is-referenced-by-count":0,"title":["Solvent
