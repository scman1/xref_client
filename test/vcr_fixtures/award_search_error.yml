        R. Soc. A."],"published-print":{"date-parts":[[2016,4]]},"abstract":"<jats:p>\n                    The
        interaction of formic acid with Raney\n                    <jats:sup>TM<\/jats:sup>\n                    Cu
        proves to be complex. Rather than the expected generation of a monolayer of
        bidentate formate, we find the formation of a Cu(II) compound. This process
        occurs by direct reaction of copper and formic acid; in contrast, previous
        methods are by solution reaction. This is a rare example of formic acid acting
        as an oxidant rather than, as more commonly found, a reductant. The combination
        of diffraction, spectroscopic and computational methods has allowed this unexpected
        process to be characterized.\n                  <\/jats:p>","DOI":"10.1098\/rspa.2016.0126","type":"journal-article","created":{"date-parts":[[2016,4,20]],"date-time":"2016-04-20T05:13:18Z","timestamp":1461129198000},"page":"20160126","update-policy":"https:\/\/doi.org\/10.1098\/crossmark-policy","source":"Crossref","is-referenced-by-count":4,"title":["The
