        \u03b2-lactamases are frequently encountered in bacterial infections caused
        by carbapenem-resistant Gram-negative bacteria. Due to the importance of carbapenems
        in treatment of healthcare-associated infections, and the increasingly wide
        dissemination of OXA-48-like enzymes on plasmids, these \u03b2-lactamases
        are of high clinical significance. Notably, OXA-48 hydrolyses imipenem more
        efficiently than other commonly used carbapenems, such as meropenem. Here,
        we use extensive multiscale simulations of imipenem and meropenem hydrolysis
        by OXA-48 to dissect the dynamics and to explore differences in reactivity
        of the possible conformational substates of the respective acylenzymes. QM\/MM
        simulations of the deacylation reaction for both substrates demonstrate that
        deacylation is favoured when the 6\u03b1-hydroxyethyl group is able to hydrogen
        bond to the water molecule responsible for deacylation, but disfavoured by
        increasing hydration of either oxygen of the carboxylated Lys73 general base.
        Differences in free energy barriers calculated from the QM\/MM simulations
        correlate well with the experimentally observed differences in hydrolytic
        efficiency between meropenem and imipenem. We conclude that the impaired breakdown
        of meropenem, compared to imipenem, which arises from a subtle change in the
        hydrogen bonding pattern between the deacylating water molecule and the antibiotic,
        is most likely induced by the meropenem 1\u03b2-methyl group. In addition
        to increased insights into carbapenem breakdown by OXA \u03b2-lactamases,
        which may aid in future efforts to design of antibiotics or inhibitors, our
        approach exemplifies the combined use of atomistic simulations in determining
        the possible different enzyme-substrate substates, and their influence on
        enzyme reaction kinetics.<\/jats:p>","DOI":"10.26434\/chemrxiv-2021-bv7tb-v2","type":"posted-content","created":{"date-parts":[[2022,3,23]],"date-time":"2022-03-23T02:46:47Z","timestamp":1648003607000},"source":"Crossref","is-referenced-by-count":1,"title":["Multiscale
