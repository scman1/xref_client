        no. 101018516"]}],"id":[{"id":"10.13039\/501100007601","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"abstract":"<jats:p>Using
        carbon dioxide (CO2) to make recyclable thermoplastics could reduce greenhouse
        gas emissions associated with polymer manufacturing. CO2\/cyclic epoxide ring-opening
        copolymerization (ROCOP) allows for &gt;30 wt% of the polycarbonate to derive
        from CO2; so far, the field has focused on oligocarbonates. In contrast, efficient
        catalysts for high molar mass polycarbonates are under-investigated and the
        resulting thermoplastic structure-property relationships, processing and recycling
        need to be elucidated. This work describes a new organometallic Mg(II)Co(II)
        catalyst that combines high productivity, low loading tolerance, the highest
        polymerization control and yields polycarbonates with molar mass values from
        4-130 kg mol-1, with narrow, monomodal distributions. Used in the ROCOP of
        CO2 with cyclohexene oxide (CHO), vinyl-cyclohexene oxide (vCHO) or cyclopentene
        oxide (CPO) to produce a series of samples, each with Mn&gt;100 kg mol-1,
        of poly(cyclohexene carbonate) (PCHC), poly(vinyl-cyclohexene carbonate) (PvCHC),
        poly(ethyl-cyclohexene carbonate) (PeCHC, produced by hydrogenation of PvCHC)
        and poly(cyclopentene carbonate) (PCPC). All these materials are amorphous
        thermoplastics, with high glass transition temperatures (85 &lt;Tg &lt;126
        \u00b0C, by DSC) and high thermal stability (Td &gt; 260 \u00b0C). The cyclic
        ring substituents mediate the materials\u2019 chain entanglements, viscosity
        and the glass transition temperatures. Specifically, PCPC shows an entanglement
        molar mass (Me = 4-5 kg mmol-1) which is 10x lower than PCHC (Me ~ 50 kg mol-1)
        and has a zero-shear viscosity (0.78 MPa s) which is 100x lower than PCHC
        (90 MPa s). PCPC also shows higher tensile strength (59 MPa) and toughness
        (3.3 MJ m-3) compared with PCHC; its properties are competitive with thermoplastics
        like polystyrene and improve upon the high temperature application window
        for poly(L-lactide). All the new polymers are fully recyclable, either by
        re-processing using compression molding or by using the Mg(II)Co(II) catalyst
        for highly selective depolymerizations to epoxides and CO2. PCPC shows the
        fastest depolymerization rates, achieving an activity of 2500 h-1 and &gt;99%
        selectivity for CPO and CO2 (1:5000, [catalyst]:[PCPC], neat films, 140 \u00b0C).
        In future, CO2\/epoxide-thermoplastic research should prioritize alkyl-substituted
        cyclohexenes or cyclopentenes since these show the highest chain entanglements,
        optimal processing and properties. Furthermore, the highly controlled, organometallic
        Mg(II)Co(II) catalyst should access other polycarbonates, terpolymers or block
        copolymers from CO2.<\/jats:p>","DOI":"10.26434\/chemrxiv-2024-7sdx8","type":"posted-content","created":{"date-parts":[[2024,1,29]],"date-time":"2024-01-29T04:36:06Z","timestamp":1706502966000},"source":"Crossref","is-referenced-by-count":1,"title":["High
